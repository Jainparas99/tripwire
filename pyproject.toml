[project]
name = "tripwire"
version = "0.1.0"
description = "Deterministic task-contract enforcement for autonomous agent tool calls."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "pydantic>=2.9",
  "pyyaml>=6.0",
  "streamlit>=1.39",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.7",
]

[project.scripts]
tripwire-demo = "tripwire.demo:main"
tripwire-gateway = "tripwire.proxy.server:main"
tripwire-investigate = "tripwire.investigation.cli:main"
tripwire-tools = "tripwire.tools.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tripwire"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
