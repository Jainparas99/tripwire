services:
  agent:
    build:
      context: ..
      dockerfile: docker/agent.Dockerfile
    environment:
      TRIPWIRE_GATEWAY_URL: "http://gateway:8080/tool-call"
      TRIPWIRE_SCENARIO: "${TRIPWIRE_SCENARIO:-slow_drift}"
    networks:
      - agent_internal
    depends_on:
      gateway:
        condition: service_healthy

  gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ["tripwire-gateway", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      TRIPWIRE_CONTRACT: "examples/contracts/support_summary.yaml"
      TRIPWIRE_AUDIT_LOG: "/data/gateway-audit.jsonl"
      TRIPWIRE_TOOL_BASE_URL: "http://mock-tools:9090"
    volumes:
      - ../.tripwire:/data
    networks:
      - agent_internal
      - tools_only
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2)"]
      interval: 2s
      retries: 15
    depends_on:
      - mock-tools

  mock-tools:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ["tripwire-tools", "--host", "0.0.0.0", "--port", "9090"]
    networks:
      - tools_only

networks:
  agent_internal:
    internal: true
  tools_only:
    internal: true
